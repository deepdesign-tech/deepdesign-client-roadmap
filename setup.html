<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepDesign Roadmap Setup</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f6fb;color:#17253e}.wrap{max-width:620px;margin:50px auto;padding:20px}.card{background:#fff;border:1px solid #dfe7f1;border-radius:16px;padding:24px;box-shadow:0 8px 30px rgba(20,45,80,.08)}h1{margin-top:0}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #ccd8e6;border-radius:10px;font:inherit}button{margin-top:14px;border:0;border-radius:10px;padding:12px 16px;background:#2059a5;color:#fff;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.muted{color:#67758b;font-size:14px;line-height:1.55}.ok{color:#087d59}.err{color:#ad2438}.hidden{display:none}.box{background:#f7f9fc;border:1px solid #e3e9f1;border-radius:12px;padding:14px;margin-top:14px}</style></head><body><main class="wrap"><section class="card"><h1>DeepDesign Roadmap Setup</h1><p class="muted">หน้านี้ใช้ครั้งเดียวเพื่อสร้าง <code>projects/demo-client</code> ใน Firebase project <code>deepdesign-client-roadmap</code> ผ่านบัญชี Admin ที่คุณสร้างไว้ ไม่มีการใช้ Service Account หรือ Billing</p><div id="loginBox"><label>Admin email</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn">เข้าสู่ระบบ</button></div><div id="setupBox" class="hidden"><div id="identity" class="box"></div><button id="createBtn">สร้าง projects/demo-client</button><button id="logoutBtn" style="background:#6a788d">ออกจากระบบ</button></div><p id="msg" class="muted"></p></section></main><script src="./firebase-config.js"></script><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';import{getFirestore,doc,getDoc,setDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const $=id=>document.getElementById(id);const cfg=window.DEEPDESIGN_FIREBASE_CONFIG;const msg=(t,e=false)=>{$('msg').textContent=t;$('msg').className=e?'err':'ok'};if(!cfg||cfg.projectId!=='deepdesign-client-roadmap'){msg('Firebase config ไม่ถูกต้อง',true);throw new Error('Bad Firebase config')}const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);$('loginBtn').onclick=async()=>{msg('กำลังเข้าสู่ระบบ...');try{await signInWithEmailAndPassword(auth,$('email').value,$('password').value)}catch(e){msg('เข้าสู่ระบบไม่สำเร็จ: '+e.code,true)}};$('logoutBtn').onclick=()=>signOut(auth);onAuthStateChanged(auth,async user=>{if(!user){$('loginBox').classList.remove('hidden');$('setupBox').classList.add('hidden');return}$('loginBox').classList.add('hidden');$('setupBox').classList.remove('hidden');try{const m=await getDoc(doc(db,'members',user.uid));if(!m.exists())throw new Error('ไม่พบ members/{UID} สำหรับบัญชีนี้');const d=m.data();if(d.role!=='admin')throw new Error('บัญชีนี้ไม่ใช่ admin');if(!Array.isArray(d.projects)||!d.projects.includes('demo-client'))throw new Error('บัญชีนี้ยังไม่ได้รับสิทธิ์ demo-client');$('identity').textContent='Admin verified: '+user.email+' · project: deepdesign-client-roadmap';msg('พร้อมสร้างข้อมูลโครงการ')}catch(e){msg(e.message,true);$('createBtn').disabled=true}});$('createBtn').onclick=async()=>{const ref=doc(db,'projects','demo-client');$('createBtn').disabled=true;msg('กำลังตรวจสอบและสร้างข้อมูล...');try{const existing=await getDoc(ref);if(existing.exists()){msg('projects/demo-client มีอยู่แล้ว — ไม่ได้เขียนทับข้อมูลเดิม');return}await setDoc(ref,{name:'DeepDesign Demo Client',phases:{},kpi:{},notes:'',updatedAt:serverTimestamp()});msg('สร้าง projects/demo-client สำเร็จแล้ว คุณสามารถเปิด Dashboard V2 ได้ทันที')}catch(e){msg('สร้างไม่สำเร็จ: '+e.code+' — '+e.message,true);$('createBtn').disabled=false}};</script></body></html>
